name: Assemble scriptlets

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: assemble-scriptlets
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out uBlock Origin
        uses: actions/checkout@v4
        with:
          repository: gorhill/uBlock
          ref: master
          path: .upstream/uBlock
          fetch-depth: 1

      - name: Resolve upstream revision
        id: upstream
        run: echo "revision=$(git -C .upstream/uBlock rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble
        run: node scripts/assemble-scriptlets.mjs .upstream/uBlock dist "${{ steps.upstream.outputs.revision }}"

      - name: Verify output is loadable
        run: |
          node -e "
            const list = require('./dist/scriptlets.json');
            if (!Array.isArray(list) || list.length < 100) throw new Error('unexpected scriptlet payload');
            for (const item of list) {
              if (typeof item.name !== 'string' || typeof item.content !== 'string') {
                throw new Error('unexpected scriptlet entry: ' + JSON.stringify(item).slice(0, 200));
              }
              Buffer.from(item.content, 'base64').toString('utf8');
            }
            console.log('Verified ' + list.length + ' scriptlets');
          "

      - name: Commit when changed
        run: |
          if git diff --quiet -- dist; then
            echo "No upstream scriptlet changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m "Update scriptlets from uBlock Origin ${{ steps.upstream.outputs.revision }}"
          git push
